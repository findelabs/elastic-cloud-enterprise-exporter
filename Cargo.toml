[package]
name = "elastic-cloud-enterprise-exporter"
version = "0.0.20"
description = "elastic-cloud-enterprise-exporter"
edition = "2021"

[dependencies]
hyper = { version = "0.14", features = ["full"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version="0.3", features = ["env-filter"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
serde_yaml = "0.8"
clap = { version = "4", features = ["cargo", "env", "derive"] }
env_logger = "0.11"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
hyper-tls = "0.5"
tower-http = { version = "0.5", features = ["trace", "auth"] }
tower = { version = "0.4", features = ["filter"] }
reqwest = { version = "0.11", features = ["json"] }
native-tls = "0.2"
base64 = "0.13"
url = { version = "2", features = ["serde"] }
metrics = "0.18"
metrics-exporter-prometheus = "0.9"
axum-extra = "0.10"
http-auth-basic = "0.3"
metrics-util = "0.12"
thiserror = "1.0.59"
tracing-opentelemetry = "0.23.0"
opentelemetry = "0.22.0"
